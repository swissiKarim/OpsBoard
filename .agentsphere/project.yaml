schemaVersion: 4
rationale: FastAPI + SQLAlchemy/SQLite with StatusCalculator, IncidentService, timeline;
  api scenarios SC-1..SC-8 need web service; SC-9 is cli; preview for ui
components:
- name: app
  path: .
  toolchain:
    image: agentsphere/sandbox-polyglot
    kind: python
  verify:
  - ruff check .
  - pytest
  - pip install -q -r requirements.txt --break-system-packages
  - pytest -v --tb=short --junitxml=.agentsphere/reports/junit.xml
  artifacts_ignore:
  - '*.db'
  - .pytest_cache/
  - .ruff_cache/
  verifySlots:
    lint:
      command: ruff check .
      source: platform_default
    test:
      command: pytest
      source: platform_default
definition_of_done:
- ruff check . und pytest laufen ohne Fehler
- GET /health antwortet auf Port 8000 (Dienst web)
network:
  needs: []
services:
- name: web
  start: bash scripts/start-web.sh
  port: 8000
  health:
    http: /health
    timeoutSec: 60
  preview:
    path: /
