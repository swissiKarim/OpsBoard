schemaVersion: 4
rationale: FastAPI + SQLAlchemy/SQLite scaffold with pytest; api scenario SC-1 needs
  web service, ui scenario SC-7 needs preview
components:
- name: app
  path: .
  toolchain:
    image: agentsphere/sandbox-polyglot
    kind: python
  verify:
  - ruff check .
  - pytest
  - pip install -q -r requirements.txt --break-system-packages
  - python -m ruff check .
  - python -m pytest -v --tb=short --junitxml=.agentsphere/reports/junit.xml
  artifacts_ignore:
  - '*.db'
  - .pytest_cache/
  - .ruff_cache/
  verifySlots:
    lint:
      command: ruff check .
      source: platform_default
    test:
      command: pytest
      source: platform_default
definition_of_done:
- ruff check and pytest run without errors
- GET /health responds on port 8000 (service web)
network:
  needs: []
services:
- name: web
  start: bash scripts/start-web.sh
  port: 8000
  health:
    http: /health
    timeoutSec: 60
  preview:
    path: /
